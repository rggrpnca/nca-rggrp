<html>
<head>
    <title>NCA - Case File Lookup</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: linear-gradient(to bottom, #0a0a0a, #1a1a1a); font-family: "Montserrat", Arial, sans-serif; color: white; display: flex; flex-direction: column; padding-top: 140px; }
        .head { display: flex; align-items: center; padding: 15px 30px; background: rgba(0,0,0,0.95); position: fixed; top: 0; left: 0; right: 0; backdrop-filter: blur(10px); justify-content: space-between; flex-wrap: nowrap; z-index: 1000; box-sizing: border-box; }
        .head img { width: 140px; flex-shrink: 0; }
        .title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px; white-space: nowrap; letter-spacing: 1px; }
        .nav { display: flex; gap: 25px; flex-shrink: 0; align-items: center; }
        .nav a { color: white; text-decoration: none; white-space: nowrap; position: relative; }
        .nav a::after { content: ""; position: absolute; width: 0%; height: 2px; bottom: -5px; left: 0; background: #00b3ff; transition: 0.3s; }
        .nav a:hover::after { width: 100%; }
        .nav .admin-link { padding: 6px 14px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; font-size: 12px; color: #aaa; transition: 0.2s; }
        .nav .admin-link:hover { border-color: #00b3ff; color: #00b3ff; }
        .nav .admin-link::after { display: none; }
        .container { display: flex; justify-content: center; margin-top: 40px; }
        .box { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 12px; width: 420px; text-align: center; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        h2 { margin-bottom: 20px; }
        select { width: 100%; padding: 12px; border-radius: 6px; border: none; margin-bottom: 20px; font-size: 14px; background: #1a1a1a; color: white; border: 1px solid rgba(255,255,255,0.15); outline: none; }
        button { padding: 12px 25px; border: none; background: #00b3ff; color: white; border-radius: 6px; cursor: pointer; transition: 0.3s; font-family: "Montserrat", Arial, sans-serif; }
        button:hover { background: #0090cc; transform: scale(1.05); }
        .status { margin-top: 15px; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
    <div class="head">
        <img src="nca.png">
        <div class="title">Case File Lookup</div>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="offenders.html">Offenders</a>
            <a href="recruitment.html">Recruitment</a>
            <a href="admin.html" class="admin-link">Admin</a>
        </div>
    </div>
    <div class="container">
        <div class="box">
            <h2>Select Case</h2>
            <select id="caseSelect"><option value="">Select Case Reference</option></select>
            <button onclick="openCase()">Access Case File</button>
            <div class="status" id="statusText"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const { createClient } = supabase;
        const db = createClient(
            "https://saigwnmokoiapfetxqtn.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhaWd3bm1va29pYXBmZXR4cXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMDMxOTAsImV4cCI6MjA4OTU3OTE5MH0.ZN4tel3cBMt8kXFUMs0afqP05rJiPsiSTH4YCgAk5Kg"
        );

        const dropdown = document.getElementById("caseSelect");
        const status   = document.getElementById("statusText");

        async function loadCases() {
            const { data, error } = await db.from("cases").select("*").order("created_at", { ascending: false });
            if (error) { status.textContent = "Failed to load cases."; return; }
            if (!data.length) { status.textContent = "No case files available."; return; }
            data.forEach(c => {
                const opt = document.createElement("option");
                opt.value = c.link;
                opt.textContent = c.case_id;
                dropdown.appendChild(opt);
            });
        }

        function openCase() {
            const selected = dropdown.value;
            if (!selected) { status.textContent = "Please select a case."; return; }
            status.textContent = "Opening case file...";
            window.open(selected, "_blank");
        }

        loadCases();
    </script>
</body>
</html>
