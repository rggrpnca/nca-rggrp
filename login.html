<html>
<head>
    <title>NCA - Admin Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(to bottom, #0a0a0a, #1a1a1a);
            font-family: "Montserrat", Arial, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg { position: fixed; inset: 0; background-image: url("ncabg.jpg"); background-size: cover; background-position: center top; background-repeat: no-repeat; filter: brightness(0.3) grayscale(0.4); z-index: -2; }
        .bg-overlay { position: fixed; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.7) 100%); z-index: -1; }
        .login-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 40px;
            width: 360px;
            text-align: center;
        }
        .login-box img { width: 120px; margin-bottom: 20px; }
        .login-box h2 { font-size: 18px; margin-bottom: 6px; }
        .login-box p { font-size: 12px; color: #555; margin-bottom: 24px; }
        .login-box input {
            width: 100%; padding: 12px 14px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05); color: white;
            font-size: 14px; outline: none; margin-bottom: 14px;
            font-family: "Montserrat", Arial, sans-serif; transition: 0.25s;
        }
        .login-box input:focus { border-color: #00b3ff; }
        .login-box button {
            width: 100%; padding: 12px;
            background: #00b3ff; border: none; border-radius: 8px;
            color: white; font-size: 14px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            font-family: "Montserrat", Arial, sans-serif;
        }
        .login-box button:hover { background: #0090cc; }
        .login-error { margin-top: 12px; font-size: 12px; color: #ff5555; display: none; }
        .back-link { margin-top: 16px; display: block; font-size: 12px; color: #555; text-decoration: none; transition: 0.2s; }
        .back-link:hover { color: #aaa; }
        .roblox-btn { display: block; width: 100%; padding: 12px; background: #00b3ff; border-radius: 8px; color: white; font-size: 14px; font-weight: bold; text-decoration: none; text-align: center; transition: 0.3s; font-family: "Montserrat", Arial, sans-serif; margin-bottom: 14px; }
        .roblox-btn:hover { background: #0090cc; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="bg-overlay"></div>
    <div class="login-box">
        <img src="nca.png">
        <h2>Admin Access</h2>
        <p>Authorised personnel only — login with your Roblox account</p>
        <a href="/api/robloxAuth" class="roblox-btn">
            <img src="https://www.roblox.com/favicon.ico" style="width:18px;vertical-align:middle;margin-right:8px;">
            Login with Roblox
        </a>
        <div class="login-error" id="loginError" style="display:none;">Access denied or an error occurred.</div>
        <a class="back-link" href="index.html">← Back to Portal</a>
    </div>

    <script>
        // Show error if redirected back with error param
        const params = new URLSearchParams(window.location.search);
        if (params.get("error")) {
            document.getElementById("loginError").style.display = "block";
        }
    </script>
</body>
</html>
