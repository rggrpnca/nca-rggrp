<html>
<head>
    <title>NCA - Offenders Database</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: linear-gradient(to bottom, #0a0a0a, #1a1a1a); font-family: "Montserrat", Arial, sans-serif; color: white; overflow-x: hidden; padding-top: 90px; }
        .bg { position: fixed; inset: 0; background-image: url("ncabg.jpg"); background-size: cover; background-position: center top; background-repeat: no-repeat; filter: brightness(0.3) grayscale(0.4); z-index: -2; }
        .bg-overlay { position: fixed; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.7) 100%); z-index: -1; }
        .head { display: flex; align-items: center; padding: 15px 30px; background: rgba(0,0,0,0.95); position: fixed; top: 0; left: 0; right: 0; backdrop-filter: blur(10px); justify-content: space-between; flex-wrap: nowrap; z-index: 1000; box-sizing: border-box; }
        .head img { width: 140px; flex-shrink: 0; }
        .title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 18px; white-space: nowrap; letter-spacing: 1px; }
        .nav { display: flex; gap: 25px; flex-shrink: 0; align-items: center; }
        .nav a { color: white; text-decoration: none; white-space: nowrap; position: relative; }
        .nav a::after { content: ""; position: absolute; width: 0%; height: 2px; bottom: -5px; left: 0; background: #00b3ff; transition: 0.3s; }
        .nav a:hover::after { width: 100%; }
        .nav .admin-link { padding: 6px 14px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; font-size: 12px; color: #aaa; transition: 0.2s; }
        .nav .admin-link:hover { border-color: #00b3ff; color: #00b3ff; }
        .nav .admin-link::after { display: none; }
        .page-header { text-align: center; padding: 40px 40px 20px; animation: fadeIn 1s ease; }
        .page-header h1 { font-size: 36px; margin-bottom: 8px; }
        .page-header p { color: #aaa; font-size: 14px; }
        .container { padding: 10px 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 22px; backdrop-filter: blur(8px); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(0,179,255,0.2); background: rgba(255,255,255,0.08); }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge.banned      { background: rgba(255,50,50,0.15);   color: #ff5555; border: 1px solid #ff5555; }
        .badge.warned      { background: rgba(255,180,0,0.15);   color: #ffb400; border: 1px solid #ffb400; }
        .badge.monitored   { background: rgba(0,179,255,0.15);   color: #00b3ff; border: 1px solid #00b3ff; }
        .badge.blacklisted { background: rgba(180,0,255,0.15);   color: #cc44ff; border: 1px solid #cc44ff; }
        .badge.other       { background: rgba(255,255,255,0.08); color: #aaa;    border: 1px solid #555; }
        .card h3 { margin: 0 0 12px; font-size: 17px; }
        .card .field { font-size: 13px; color: #888; margin: 5px 0; }
        .card .field span { color: #ddd; font-weight: 500; }
        .card .reason-box { margin-top: 12px; font-size: 12px; color: #999; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; font-style: italic; line-height: 1.5; }
        .empty-msg { text-align: center; color: #444; padding: 80px 0; font-size: 15px; grid-column: 1 / -1; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 30px 0 20px; flex-wrap: wrap; }
        .pagination button { padding: 8px 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #aaa; cursor: pointer; font-size: 13px; transition: 0.2s; font-family: "Montserrat", Arial, sans-serif; }
        .pagination button:hover:not(:disabled) { border-color: #00b3ff; color: #00b3ff; }
        .pagination button.active { background: #00b3ff; border-color: #00b3ff; color: white; font-weight: bold; }
        .pagination button:disabled { opacity: 0.25; cursor: default; }
        .page-info { text-align: center; font-size: 12px; color: #555; padding-bottom: 10px; }
        .footer { text-align: center; font-size: 12px; color: #444; padding: 20px 30px 40px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .head { flex-wrap: wrap; padding: 12px 20px; } .title { position: relative; left: 0; transform: none; width: 100%; text-align: center; margin-top: 5px; } .nav { margin-top: 8px; gap: 15px; } .container { padding: 10px 20px 20px; } }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="bg-overlay"></div>
    <div class="head">
        <img src="nca.png">
        <div class="title">Offenders Database</div>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="casefiles.html">Case Lookup</a>
            <a href="recruitment.html">Recruitment</a>
            <a href="login.html" class="admin-link">Admin</a>
        </div>
    </div>
    <div class="page-header">
        <h1>Offenders Database</h1>
        <p>Individuals listed under monitored or sanctioned criminal activity.</p>
    </div>
    <div class="container"><div class="grid" id="grid"></div></div>
    <div class="page-info" id="pageInfo"></div>
    <div class="pagination" id="pagination"></div>
    <div class="footer">© National Crime Agency • Offenders Database • Authorized Public Access</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const { createClient } = supabase;
        const db = createClient(
            "https://saigwnmokoiapfetxqtn.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhaWd3bm1va29pYXBmZXR4cXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMDMxOTAsImV4cCI6MjA4OTU3OTE5MH0.ZN4tel3cBMt8kXFUMs0afqP05rJiPsiSTH4YCgAk5Kg"
        );

        const PER_PAGE = 10;
        let currentPage = 1;
        let allOffenders = [];

        async function loadOffenders() {
            const { data, error } = await db.from("offenders").select("*").order("created_at", { ascending: false });
            if (error) { console.error(error); return; }
            allOffenders = data || [];
            render();
        }

        function getBadgeClass(p) {
            p = (p || "").toLowerCase();
            if (p.includes("ban"))       return "banned";
            if (p.includes("warn"))      return "warned";
            if (p.includes("monitor"))   return "monitored";
            if (p.includes("blacklist")) return "blacklisted";
            return "other";
        }

        function render() {
            const totalPages = Math.max(1, Math.ceil(allOffenders.length / PER_PAGE));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PER_PAGE;
            const slice = allOffenders.slice(start, start + PER_PAGE);
            const grid = document.getElementById("grid");
            grid.innerHTML = "";
            if (!allOffenders.length) {
                grid.innerHTML = `<div class="empty-msg">No offenders on record.</div>`;
                document.getElementById("pageInfo").textContent = "";
                document.getElementById("pagination").innerHTML = "";
                return;
            }
            slice.forEach(o => {
                const card = document.createElement("div");
                card.className = "card";
                const date = o.created_at ? new Date(o.created_at).toLocaleString() : "N/A";
                card.innerHTML = `
                    <span class="badge ${getBadgeClass(o.punishment)}">${o.punishment || "Unknown"}</span>
                    <h3>${o.roblox || "Unknown"}</h3>
                    <div class="field">Discord: <span>${o.discord || "N/A"}</span></div>
                    <div class="field">Regiment: <span>${o.regiment || "N/A"}</span></div>
                    <div class="field">Issued: <span>${date}</span></div>
                    <div class="reason-box">"${o.reason || "No reason provided."}"</div>
                `;
                grid.appendChild(card);
            });
            document.getElementById("pageInfo").textContent = `Showing ${start + 1}–${Math.min(start + PER_PAGE, allOffenders.length)} of ${allOffenders.length} offenders`;
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";
            const prev = document.createElement("button");
            prev.textContent = "← Prev";
            prev.disabled = currentPage === 1;
            prev.onclick = () => { currentPage--; render(); window.scrollTo(0,0); };
            pagination.appendChild(prev);
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;
                if (i === currentPage) btn.classList.add("active");
                btn.onclick = (function(p) { return () => { currentPage = p; render(); window.scrollTo(0,0); }; })(i);
                pagination.appendChild(btn);
            }
            const next = document.createElement("button");
            next.textContent = "Next →";
            next.disabled = currentPage === totalPages;
            next.onclick = () => { currentPage++; render(); window.scrollTo(0,0); };
            pagination.appendChild(next);
        }

        loadOffenders();
    </script>
</body>
</html>
